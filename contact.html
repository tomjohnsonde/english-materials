  <body data-page="contact">
    <noscript><p class="noscript-note">Please enable JavaScript to use the contact form. You can still email Tom directly at tomjohnsonde@gmail.com.</p></noscript>
    <a class="skip-link" href="#main">Skip to content</a>
    <header data-site-header></header>
    <main id="main"><section class="page-intro page-intro--contact"><div class="container"><p class="eyebrow eyebrow--coral">Keep in touch</p><h1>Send a message to Tom</h1><p>Write a message here and open a ready-to-send email in your usual mail app.</p></div></section><section class="section section--paper"><div class="container contact-layout"><form class="contact-form" data-contact-form novalidate><div class="form-row"><label>First name<input name="firstName" required autocomplete="given-name" /></label><label>Last name<input name="lastName" required autocomplete="family-name" /></label></div><label>Email<input name="email" type="email" required autocomplete="email" /></label><label>Message for your teacher<textarea name="message" required rows="5" placeholder="What would you like to work on?"></textarea></label><button class="button button--coral" type="submit">Open email <span aria-hidden="true">→</span></button><p class="form-status" data-form-status role="status"></p></form><aside class="contact-aside"><p class="eyebrow eyebrow--coral">Email contact</p><h2>Contact Tom directly.</h2><p>Prefer to write your own email? Use the address below, or copy it if an email app is not set up on this device.</p><div class="contact-actions"><a class="text-link" href="mailto:tomjohnsonde@gmail.com">Send an email <span aria-hidden="true">→</span></a><button class="text-link text-link--button" type="button" data-copy-email>Copy email address</button></div><p class="copy-status" data-copy-status role="status"></p></aside></div></section></main>
    <footer data-site-footer></footer>
