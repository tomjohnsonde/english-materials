    <main id="main"><section class="page-intro page-intro--contact"><div class="container"><p class="eyebrow eyebrow--coral">Keep in touch</p><h1>Send a message to Tom</h1><p>Write a message here and open a ready-to-send email in your usual mail app.</p></div></section><section class="section section--paper"><div class="container contact-layout"><form class="contact-form" data-contact-form novalidate><div class="form-row"><label>First name<input name="firstName" required autocomplete="given-name" /></label><label>Last name<input name="lastName" required autocomplete="family-name" /></label></div><label>Email<input name="email" type="email" required autocomplete="email" /></label><label>Message for your teacher<textarea name="message" required rows="5" placeholder="What would you like to work on?"></textarea></label><button class="button button--coral" type="submit">Open email <span aria-hidden="true">→</span></button><p class="form-status" data-form-status role="status"></p></form><aside class="contact-aside"><p class="eyebrow eyebrow--coral">Email contact</p><h2>Contact Tom directly.</h2><p>Prefer to write your own email? Use the address below.</p><a class="text-link" href="mailto:tomjohnsonde@gmail.com">Send an email <span aria-hidden="true">→</span></a></aside></div></section></main>
    <footer data-site-footer></footer>
